<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NKQ8N8Y62D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NKQ8N8Y62D');
    </script>

    <meta charset="utf-8">
    <title>rusty's home on the web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="/styles/styles.css" rel="stylesheet">

    <script src="/js/jquery-1.12.4.min.js"></script>
    <script src="/js/jquery.tablesorter.min.js"></script>
    <script>
      // Keep the legacy 2.0.x header class names so styles.css still applies.
      // In every sort direction, non-numeric text (e.g. "N/A") sinks to the
      // bottom of a numeric column, and blank cells sink below even that.
      $.extend($.tablesorter.defaults, {
        theme: '',
        cssHeader: 'header',
        cssAsc: 'headerSortUp',
        cssDesc: 'headerSortDown',
        emptyTo: 'bottom',
        stringTo: 'bottom'
      });
    </script>
  </head>

{% if page.body_class %}
  <body class="{{ page.body_class }}">
{% else %}
  <body>
{% endif %}

    <div class="container">

      {% if layout.navbar or page.navbar %}
      <nav class="site-nav">
        <a class="site-nav-brand" href="/">&#8604; geldmacher.net</a>
      </nav>
      {% endif %}

      <div class="layout">
        <div class="sidebar">
          {% unless page.layout == 'good_eats_post' %}
          <h1>{{ page.title }}</h1>
          {% endunless %}
          {% contentblock sidebar %}
        </div>
        <div class="main">
          {{ content }}
        </div>
      </div>
    </div>
  </body>
</html>
